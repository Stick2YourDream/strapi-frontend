name: Azure Static Web Apps CI/CD

on:
  push:
    branches: [main]
  pull_request:
    types: [opened, synchronize, reopened, closed]
    branches: [main]

jobs:
  build_and_deploy_job:
    if: github.event_name == 'push' || (github.event_name == 'pull_request' && github.event.action != 'closed')
    runs-on: ubuntu-latest
    name: Build and Deploy Job
    steps:
      - uses: actions/checkout@v3
        with:
          submodules: true
          lfs: false

      - uses: actions/setup-node@v3
        with:
          node-version: '20.19.0'
          cache: 'npm'
          cache-dependency-path: '**/package-lock.json'

      - name: Set up Java for Android
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Build Android APK
        if: github.event_name == 'push'
        env:
          YSP_KEYSTORE_PATH: ${{ github.workspace }}/android-twa/keystore.jks
          YSP_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          YSP_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          YSP_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          if [ ! -d "android-twa" ]; then
            echo "android-twa directory not found. Add it to this repo or update the workflow to fetch it." >&2
            exit 1
          fi
          BUILD_VERSION_CODE=$((GITHUB_RUN_NUMBER + 2000))
          BUILD_VERSION_NAME="2.${GITHUB_RUN_NUMBER}"
          echo "VITE_ANDROID_APK_VERSION=$BUILD_VERSION_NAME" >> $GITHUB_ENV
          echo "VITE_ANDROID_APK_CODE=$BUILD_VERSION_CODE" >> $GITHUB_ENV
          echo "${{ secrets.ANDROID_KEYSTORE_BASE64 }}" | base64 -d > android-twa/keystore.jks
          chmod +x android-twa/gradlew
          cd android-twa
          ./gradlew assembleRelease \
            -PYSP_KEYSTORE_PATH="$YSP_KEYSTORE_PATH" \
            -PYSP_KEYSTORE_PASSWORD="$YSP_KEYSTORE_PASSWORD" \
            -PYSP_KEY_ALIAS="$YSP_KEY_ALIAS" \
            -PYSP_KEY_PASSWORD="$YSP_KEY_PASSWORD" \
            -PYSP_VERSION_CODE="$BUILD_VERSION_CODE" \
            -PYSP_VERSION_NAME="$BUILD_VERSION_NAME"
          cd ..
          APK_PATH=$(ls -t android-twa/app/build/outputs/apk/release/*.apk | head -n 1)
          if [ -z "$APK_PATH" ]; then
            echo "Release APK not found in android-twa/app/build/outputs/apk/release" >&2
            exit 1
          fi
          cp "$APK_PATH" public/downloads/yoursocialplace-android.apk

      - name: Build frontend
        working-directory: .
        env:
          VITE_API_URL: ${{ secrets.VITE_API_URL }} # set to your backend API URL
        run: |
          npm ci
          npm run build
          cp staticwebapp.config.json dist/

      - name: Deploy to Azure Static Web Apps
        id: builddeploy
        uses: Azure/static-web-apps-deploy@v1
        with:
          azure_static_web_apps_api_token: ${{ secrets.AZURE_STATIC_WEB_APPS_API_TOKEN_LIVELY_OCEAN_0C1C5F21E }}
          repo_token: ${{ secrets.GITHUB_TOKEN }}
          action: "upload"
          app_location: "dist"   # deploy the built output
          api_location: ""
          output_location: ""
          skip_app_build: true

  close_pull_request_job:
    if: github.event_name == 'pull_request' && github.event.action == 'closed'
    runs-on: ubuntu-latest
    name: Close Pull Request Job
    steps:
      - name: Close Pull Request
        id: closepullrequest
        uses: Azure/static-web-apps-deploy@v1
        with:
          azure_static_web_apps_api_token: ${{ secrets.AZURE_STATIC_WEB_APPS_API_TOKEN_LIVELY_OCEAN_0C1C5F21E }}
          action: "close"

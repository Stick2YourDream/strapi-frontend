name: Build and deploy frontend to Azure Web App - Strapi-Frontend

on:
  push:
    branches: [main]
  workflow_dispatch:

env:
  APP_NAME: Strapi-Frontend
  NODE_VERSION: '20.x'
  APP_PATH: .

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v3
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: ${{ env.APP_PATH }}/package-lock.json

      - name: Install, build, and include production node_modules
        working-directory: ${{ env.APP_PATH }}
        run: |
          npm ci
          npm run build
          npm ci --omit=dev  # keep production deps (serve) for deploy

      - name: Upload app with dist and node_modules
        uses: actions/upload-artifact@v4
        with:
          name: frontend-app
          path: ${{ env.APP_PATH }}/

  deploy:
    runs-on: ubuntu-latest
    needs: build
    permissions:
      id-token: write
      contents: read
    steps:
      - name: Download app artifact
        uses: actions/download-artifact@v4
        with:
          name: frontend-app
          path: .

      - name: Login to Azure
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZUREAPPSERVICE_CLIENTID_8A16656BB3F94B1792C330B9C13F9C71 }}
          tenant-id: ${{ secrets.AZUREAPPSERVICE_TENANTID_B12D577ABC1748E2A31877299D2C5C7B }}
          subscription-id: ${{ secrets.AZUREAPPSERVICE_SUBSCRIPTIONID_6AC2164D1C204E689EFE4F269FAAFD76 }}

      - name: Deploy to Azure Web App
        uses: azure/webapps-deploy@v3
        with:
          app-name: ${{ env.APP_NAME }}
          slot-name: Production
          package: .
